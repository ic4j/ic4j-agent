name: IC4J Java compatibility pilot

# GitHub requires workflow_dispatch on the default branch. An explicit
# [run ic4j pilot] commit to this one branch allows pre-merge validation.
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
  push:
    branches: [ci/ic4j-java-compatibility-pilot]

permissions:
  contents: read

jobs:
  changes:
    if: >-
      github.repository == 'ic4j/ic4j-agent' &&
      (github.event_name == 'pull_request' ||
       github.event_name == 'workflow_dispatch' ||
       contains(github.event.head_commit.message, '[run ic4j pilot]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      - name: Check whether the PR only changes Markdown
        id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          revisions_match() {
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" |
              jq -e --arg head "$PR_HEAD" --arg base "$PR_BASE" '
                ($head != "") and ($base != "")
                and (.head.sha == $head) and (.base.sha == $base)
              ' >/dev/null
          }
          run=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]] &&
            revisions_match &&
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" |
              jq -es --argjson expected "$CHANGED_FILES" '
                [ .[][] ] as $files
                | ($expected > 0) and ($expected < 3000)
                  and (($files | length) == $expected)
                  and all($files[];
                    (.filename | endswith(".md"))
                    and ((.previous_filename // .filename) | endswith(".md")))
              ' >/dev/null &&
            revisions_match; then
            run=false
          fi
          printf 'run=%s\n' "$run" >> "$GITHUB_OUTPUT"
          printf 'Run integration tests: %s\n' "$run"

  compatibility:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '11', '21']
    env:
      CANDID_REV: 35933a00ebfaeff6852010deed1633773c19b3a9
      TRANSPORT_REV: e5314fa19bea47eb943e41f6cc6abee784593dcb
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: agent
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ic4j/ic4j-candid
          ref: ${{ env.CANDID_REV }}
          path: candid
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: matrix.java != '8'
        with:
          repository: ic4j/ic4j-java11transport
          ref: ${{ env.TRANSPORT_REV }}
          path: transport
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          gradle-version: '8.14'
          cache-disabled: true
      - name: Build and test Candid and Agent, plus Java HTTP Transport on 11 and newer
        env:
          TEST_JAVA: ${{ matrix.java }}
          CI_MAVEN_REPO: ${{ runner.temp }}/ic4j-maven
        run: bash agent/ci/run-pilot.sh build
      - name: Verify Apache, OkHttp and eligible Java HTTP Transport against local ICP
        env:
          TEST_JAVA: ${{ matrix.java }}
          CI_MAVEN_REPO: ${{ runner.temp }}/ic4j-maven
        run: bash agent/ci/run-pilot.sh smoke
      - name: Preserve test reports and provenance
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ic4j-java-${{ matrix.java }}-reports
          retention-days: 10
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/ic4j-pilot-reports/
            candid/build/test-results/test/
            agent/build/test-results/test/

  pr-checks:
    name: IC4J Agent PR checks
    needs: [changes, compatibility]
    if: ${{ always() && github.event_name == 'pull_request' && github.repository == 'ic4j/ic4j-agent' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report result
        env:
          CLASSIFY: ${{ needs.changes.result }}
          SELECTED: ${{ needs.changes.outputs.run }}
          TESTS: ${{ needs.compatibility.result }}
        run: |
          test "$CLASSIFY" = success
          case "$SELECTED:$TESTS" in
            false:skipped) echo "Markdown-only PR; integration tests not needed." ;;
            true:success) echo "Integration tests passed." ;;
            *) echo "Integration test result: $TESTS (selected: $SELECTED)"; exit 1 ;;
          esac
