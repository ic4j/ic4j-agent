plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.ic4j:ic4j-candid:0.8.5'
    implementation 'org.ic4j:ic4j-agent:0.8.5'
    implementation 'org.ic4j:ic4j-java11transport:0.8.5'
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.6.5'
}

application {
    mainClass = 'org.ic4j.ci.LocalReplicaSmoke'
    applicationDefaultJvmArgs = ['-Dic4j.ci.repo=' + System.getProperty('maven.repo.local')]
}

tasks.withType(JavaCompile).configureEach { options.release = 11 }
