plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

def transport = providers.gradleProperty('pilotTransport').get()
def clientVersion = providers.gradleProperty('pilotClientVersion').get()
def testJava = providers.gradleProperty('pilotJava').get()
def clientModules = [
    'apache': 'org.apache.httpcomponents.client5:httpclient5',
    'okhttp': clientVersion.startsWith('5.') ? 'com.squareup.okhttp3:okhttp-jvm' : 'com.squareup.okhttp3:okhttp',
    'java-http': 'org.ic4j:ic4j-java11transport'
]
if (!clientModules.containsKey(transport) || (transport == 'java-http' && testJava == '8')) {
    throw new GradleException("Unsupported transport/Java lane: ${transport}/${testJava}")
}

dependencies {
    implementation 'org.ic4j:ic4j-candid:0.8.5'
    implementation 'org.ic4j:ic4j-agent:0.8.5'
    // Agent expects the application to supply its logging runtime.
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.20'
    runtimeOnly(clientModules[transport]) {
        version { strictly(clientVersion) }
    }
}

application {
    mainClass = 'org.ic4j.ci.LocalReplicaSmoke'
    applicationDefaultJvmArgs = [
        '-Dic4j.ci.repo=' + System.getProperty('maven.repo.local'),
        '-Dic4j.ci.transport=' + transport,
        '-Dic4j.ci.clientVersion=' + clientVersion,
        '-Dic4j.ci.java=' + testJava
    ]
}

tasks.withType(JavaCompile).configureEach {
    if (JavaVersion.current().isJava9Compatible()) {
        options.release = transport == 'java-http' ? 11 : 8
    }
}
